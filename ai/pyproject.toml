[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oppradar-ai"
version = "0.1.0"
description = "AI core of OppRadar: ingestion, CV parsing, matching, chat."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "rapidfuzz>=3.9",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
cv = [
    "pypdf>=4.2",
    "python-docx>=1.1",
]
embeddings = [
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pypdf>=4.2",
    "python-docx>=1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["oppradar_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
