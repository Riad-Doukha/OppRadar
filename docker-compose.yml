# Backend + frontend in containers, against your Supabase project.
#
#   docker compose up --build        then open http://localhost:3000
#
# Reads the root .env (same file as local dev): the API gets it at runtime,
# the web image gets the NEXT_PUBLIC_* values at build time. Supabase itself
# isn't containerised here — use the hosted project (or `supabase start`
# and point the URLs at it). Apply supabase/migrations first.
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: frontend
      args:
        # The browser calls the API on the host's published port.
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set NEXT_PUBLIC_SUPABASE_URL in .env}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?set NEXT_PUBLIC_SUPABASE_ANON_KEY in .env}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped
